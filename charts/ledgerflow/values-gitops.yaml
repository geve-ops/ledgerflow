# Values used by Argo CD. The CI "release" job rewrites image.tag after each successful build,
# so a merge to main is the only action needed to deploy.
image:
  repository: ghcr.io/geve-ops/ledgerflow
  tag: sha-af099ef
  pullPolicy: IfNotPresent

api:
  rateLimitPerMinute: 121000   # load-test profile (2000 req/s per client); default is 120/min
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 70
    targetRequestsPerSecond: 40

worker:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetLagPerReplica: 500
