# Values used by Argo CD. The CI "release" job rewrites image.tag after each successful build,
# so a merge to main is the only action needed to deploy.
image:
  repository: ghcr.io/geve-ops/ledgerflow
  tag: sha-bcb5ebf
  pullPolicy: IfNotPresent

api:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 70
    targetRequestsPerSecond: 40
