# One ServiceAccount per workload. None of them call the Kubernetes API, so none get a
# token mounted and none are bound to any Role (least privilege = no API access).
{{- range $name := list "ledgerflow-api" "ledgerflow-worker" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "ledgerflow.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.migrate.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledgerflow-migrate
  labels: {{- include "ledgerflow.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
{{- end }}
