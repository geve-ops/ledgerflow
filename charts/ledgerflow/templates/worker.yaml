{{- $sel := dict "name" "ledgerflow-worker" "root" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerflow-worker
  labels: {{- include "ledgerflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: ledgerflow-worker
spec:
  {{- if not .Values.worker.hpa.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "ledgerflow.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ledgerflow.selector" $sel | nindent 8 }}
        app.kubernetes.io/part-of: ledgerflow
    spec:
      serviceAccountName: ledgerflow-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {{- include "ledgerflow.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "ledgerflow.selector" $sel | nindent 14 }}
      containers:
        - name: worker
          image: {{ include "ledgerflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "ledgerflow.worker.main"]
          ports:
            - {name: metrics, containerPort: {{ .Values.worker.metricsPort }}}
          env:
            {{- include "ledgerflow.env" . | nindent 12 }}
            - name: LEDGER_WORKER_METRICS_PORT
              value: {{ .Values.worker.metricsPort | quote }}
            # Pool sizes are budgeted against Postgres max_connections (100) at max replicas.
            - name: LEDGER_DB_POOL_MAX
              value: {{ .Values.worker.dbPoolMax | quote }}
            - name: LEDGER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
          securityContext: {{- include "ledgerflow.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}   # fails if the consume loop stalls >30s
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledgerflow-worker
  labels: {{- include "ledgerflow.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "ledgerflow.selector" $sel | nindent 6 }}
{{- if .Values.worker.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledgerflow-worker
  labels: {{- include "ledgerflow.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ledgerflow-worker}
  minReplicas: {{ .Values.worker.hpa.minReplicas }}
  maxReplicas: {{ .Values.worker.hpa.maxReplicas }}
  metrics:
    # Scale on queue depth: desired replicas = ceil(stream lag / targetLagPerReplica)
    - type: External
      external:
        metric: {name: ledger_stream_lag}
        target: {type: AverageValue, averageValue: {{ .Values.worker.hpa.targetLagPerReplica | quote }}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Pods, value: 2, periodSeconds: 30}
    scaleDown:
      stabilizationWindowSeconds: 180
{{- end }}
