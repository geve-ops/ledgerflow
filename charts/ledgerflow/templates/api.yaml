{{- $sel := dict "name" "ledgerflow-api" "root" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerflow-api
  labels: {{- include "ledgerflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: ledgerflow-api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below desired capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels: {{- include "ledgerflow.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ledgerflow.selector" $sel | nindent 8 }}
        app.kubernetes.io/part-of: ledgerflow
    spec:
      serviceAccountName: ledgerflow-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {{- include "ledgerflow.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "ledgerflow.selector" $sel | nindent 14 }}
      containers:
        - name: api
          image: {{ include "ledgerflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "ledgerflow.api.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}", "--no-server-header"]
          ports:
            - {name: http, containerPort: {{ .Values.api.port }}}
          env:
            {{- include "ledgerflow.env" . | nindent 12 }}
            - name: LEDGER_API_KEYS
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.app }}, key: api-keys}
            - name: LEDGER_RATE_LIMIT_PER_MINUTE
              value: {{ .Values.api.rateLimitPerMinute | quote }}
          securityContext: {{- include "ledgerflow.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}   # let the Service drop this pod before SIGTERM
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ledgerflow-api
  labels: {{- include "ledgerflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: ledgerflow-api
spec:
  selector: {{- include "ledgerflow.selector" $sel | nindent 4 }}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledgerflow-api
  labels: {{- include "ledgerflow.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "ledgerflow.selector" $sel | nindent 6 }}
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledgerflow-api
  labels: {{- include "ledgerflow.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ledgerflow-api}
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.api.hpa.targetCPUUtilization }}}
{{- end }}
