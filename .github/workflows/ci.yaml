name: ci

on:
  push:
    branches: [main]
    paths: ["services/**", "charts/**", "gitops/**", ".github/workflows/**"]
  workflow_dispatch:
  pull_request:
    paths: ["services/**", "charts/**", "gitops/**", ".github/workflows/**"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ledgerflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/app/pyproject.toml
      - name: Install
        run: pip install -e "services/app[dev]"
      - name: Test (real Postgres and Redis via Testcontainers)
        working-directory: services/app
        run: pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm lint and render
        run: |
          helm lint charts/ledgerflow -f charts/ledgerflow/values-gitops.yaml
          helm template ledgerflow charts/ledgerflow -f charts/ledgerflow/values-gitops.yaml > /tmp/rendered.yaml
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: Validate manifests against the Kubernetes schemas
        run: |
          kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered.yaml \
            gitops/data gitops/network-policies gitops/edge gitops/platform/namespaces.yaml

  image:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: services/app
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: services/app
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

  release:
    # GitOps hand-off: commit the new image tag; Argo CD notices and rolls it out.
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tag
        run: |
          sed -i "s/^  tag: .*/  tag: ${{ needs.image.outputs.tag }}/" charts/ledgerflow/values-gitops.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/ledgerflow/values-gitops.yaml
          git diff --cached --quiet || git commit -m "deploy: ledgerflow ${{ needs.image.outputs.tag }}"
          git push
