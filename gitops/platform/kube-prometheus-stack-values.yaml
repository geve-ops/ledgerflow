# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack --version 92.2.0 -n monitoring
fullnameOverride: kps

# Pick up every PodMonitor / PrometheusRule in the cluster, not only ones labelled with this release.
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 3d
    resources:
      requests: {cpu: 200m, memory: 600Mi}
      limits: {memory: 1500Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources: {requests: {storage: 5Gi}}

alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
  defaultDashboardsEnabled: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}

# Not meaningful or not reachable on a Kind cluster.
nodeExporter:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
kube-state-metrics:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
