# CloudNativePG Barman Cloud plugin (object-store backups and WAL archiving).
# Needs cert-manager (mTLS between the operator and the plugin).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system
resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.15.1/manifest.yaml
