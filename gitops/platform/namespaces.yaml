# Application + data namespace. Pod Security "restricted" is ENFORCED: any pod that is
# privileged, runs as root, or lacks a seccomp profile is rejected at admission.
apiVersion: v1
kind: Namespace
metadata:
  name: ledger
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
