# helm install prometheus-adapter prometheus-community/prometheus-adapter --version 5.3.0 -n monitoring
# Serves the custom.metrics.k8s.io API so the HPA can scale on request rate.
prometheus:
  url: http://kps-prometheus.monitoring.svc
  port: 9090

rules:
  default: false
  custom:
    # ledger_api_requests_total (counter)  ->  ledger_api_requests_per_second (per pod)
    - seriesQuery: 'ledger_api_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: namespace}
          pod: {resource: pod}
      name:
        matches: "^(.*)_total$"
        as: "${1}_per_second"
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'

resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {memory: 192Mi}
