# Daily base backup at 02:00 (6-field cron: seconds first); the first runs immediately.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ledger-daily
  namespace: ledger
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster: {name: ledger-db}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

