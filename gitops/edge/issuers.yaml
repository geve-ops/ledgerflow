# Local CA chain: self-signed root -> CA issuer used by the Gateway.
# In production, replace ledgerflow-ca with an ACME (Let's Encrypt) ClusterIssuer;
# nothing else in the chart or Gateway changes.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ledgerflow-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: ledgerflow-root-ca
  secretName: ledgerflow-root-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ledgerflow-ca
spec:
  ca:
    secretName: ledgerflow-root-ca
