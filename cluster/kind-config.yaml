# 3-node local cluster. Default CNI is disabled so Cilium can enforce NetworkPolicies.
# The Gateway is reached with scripts/edge-forward.ps1 (Docker Desktop's published ports
# are intercepted by the WSL relay on Windows, so no extraPortMappings here).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ledgerflow
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
