# 3-node local cluster. Default CNI is disabled so Cilium can enforce NetworkPolicies.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ledgerflow
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
    extraPortMappings:
      # Gateway (Envoy) NodePorts exposed on the host
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker

