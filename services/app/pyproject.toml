[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerflow"
version = "0.1.0"
description = "Event-driven double-entry ledger: API + worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "testcontainers[postgres,redis]>=4.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
